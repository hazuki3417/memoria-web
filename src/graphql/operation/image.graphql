mutation UploadImage($input: UploadImageInput!) {
  uploadImage(input: $input) {
    id
  }
}

query GetImages($input: PaginationInput) {
  getImages(input: $input) {
    edges {
      node {
        id
        info {
          file {
            name
            size
          }
          size {
            width
            height
          }
          tags
        }
        src {
          thumbnail
          preview
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPrevPage
      startCursor
      endCursor
    }
  }
}
