extend type Query {
  me: User!
}

type User {
  id: ID!
  profile: Profile!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Profile {
  name: String!
  email: String!
}

extend type Mutation {
  updateProfile(input: UpdateProfile!): User!
}

input UpdateProfile {
  name: String!
  email: String!
}
