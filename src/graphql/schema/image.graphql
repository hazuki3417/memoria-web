extend type Query {
  getImages(input: PaginationInput): ImageConnection!
}

extend type Mutation {
  uploadImage(input: UploadImageInput!): Image!
}

input UploadImageInput {
  file: Upload!
  tags: [String!]!
  visibility: Visibility!
}

# === data model ===

type Image {
  id: ID!
  info: ImageInfo!
  src: ImageSrc!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ImageInfo {
  file: ImageFile!
  size: ImageSize!
  tags: [String!]!
}

type ImageFile {
  name: String!
  size: Int!
}

type ImageSize {
  width: Int!
  height: Int!
}

type ImageSrc {
  thumbnail: String!
  preview: String!
}

# === relay model ===

type ImageEdge {
  node: Image!
  cursor: String!
}

type ImageConnection {
  edges: [ImageEdge!]!
  pageInfo: PageInfo!
}
