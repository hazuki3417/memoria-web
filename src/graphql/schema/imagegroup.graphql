extend type Query {
  imageGroups(
    first: Int
    last: Int
    after: String
    before: String
    filter: ImageGroupsFilterInput
  ): ImageGroupConnection!
  imageGroup(input: ImageGroupInput!): ImageGroup!
}

input ImageGroupsFilterInput {
  name: String @tag(validate: "search_image_group_name")
}

input ImageGroupInput {
  id: ID! @tag(validate: "ulid")
}

extend type Mutation {
  createImageGroup(input: CreateImageGroupInput!): CreateImageGroupPayload!
  updateImageGroup(input: UpdateImageGroupInput!): UpdateImageGroupPayload!
  deleteImageGroup(input: DeleteImageGroupInput!): DeleteImageGroupPayload!
}

input CreateImageGroupInput {
  name: String! @tag(validate: "input_image_group_name")
  imageIds: [ID!]! @tag(validate: "min=1,dive,ulid")
}

input UpdateImageGroupInput {
  id: ID! @tag(validate: "ulid")
  name: String! @tag(validate: "input_image_group_name")
  addedImageIds: [ID!]! @tag(validate: "dive,ulid")
  removedImageIds: [ID!]! @tag(validate: "dive,ulid")
}

input DeleteImageGroupInput {
  id: ID! @tag(validate: "ulid")
}

# === payload ===
# NOTE: 対象情報の他に付属する情報を返却したいケースに対応するためPayloadという層を用意している
type CreateImageGroupPayload {
  node: ImageGroup!
}

type UpdateImageGroupPayload {
  node: ImageGroup!
}

type DeleteImageGroupPayload {
  id: ID!
}


type ImageGroup {
  id: ID!
  name: String!
  count: Int!
  thumbnails: [String!]!
  images(
    first: Int
    last: Int
    after: String
    before: String
    filter: ImagesFilterInput
  ): ImageConnection!
  createdAt: DateTime!
  updatedAt: DateTime!
}



# === relay model ===

type ImageGroupEdge {
  node: ImageGroup!
  cursor: String!
}

type ImageGroupConnection {
  edges: [ImageGroupEdge!]!
  pageInfo: PageInfo!
}
