# Snapshot aligned with memoria-api feature/user-preferences GraphQL schema.
# Query/Mutation roots are made explicit for client-side GraphQL tooling.
scalar Upload
scalar DateTime
scalar Int64
type Query { me: User }
type Mutation {
 registerUser(input: RegisterUserInput!): RegisterUserPayload!
 updateUserProfile(input: UpdateUserProfileInput!): UpdateUserProfilePayload!
 updateUserPreferences(input: UpdateUserPreferencesInput!): UpdateUserPreferencesPayload!
 createCommunity(input: CreateCommunityInput!): CreateCommunityPayload!
}
type User { id: ID! profile: UserProfile! preferences: UserPreferences! usage: UserUsage! createdAt: DateTime! updatedAt: DateTime! }
type UserProfile { nickname: String! }
input RegisterUserInput { nickname: String! }
type RegisterUserPayload { user: User! }
input UpdateUserProfileInput { nickname: String! }
type UpdateUserProfilePayload { user: User! }
type Community { id: ID! name: String! createdAt: DateTime! updatedAt: DateTime! mySettings: CommunitySettings! }
type CommunitySettings { accentColor: String! alias: String }
input UpdateCommunitySettingsInput { communityId: ID! accentColor: String alias: String }
type UpdateCommunitySettingsPayload { settings: CommunitySettings! }
input CreateCommunityInput { name: String! }
type CreateCommunityPayload { community: Community! }
type PageInfo { hasNextPage: Boolean! hasPreviousPage: Boolean! startCursor: String endCursor: String }

enum DateFormat { YYYY_MM_DD MM_DD_YYYY DD_MM_YYYY }
enum FileSizeUnit { DECIMAL BINARY }
enum MediaThumbnailSize { SMALL MEDIUM LARGE }
type UserPreferences {
 personalAccentColor: String!
 dateFormat: DateFormat!
 fileSizeUnit: FileSizeUnit!
 mediaThumbnailSize: MediaThumbnailSize!
 mediaDetailNavigationWrap: Boolean!
 mediaDetailInitialInfoWide: Boolean!
 mediaDetailInitialInfoMedium: Boolean!
}
input UpdateUserPreferencesInput {
 personalAccentColor: String
 dateFormat: DateFormat
 fileSizeUnit: FileSizeUnit
 mediaThumbnailSize: MediaThumbnailSize
 mediaDetailNavigationWrap: Boolean
 mediaDetailInitialInfoWide: Boolean
 mediaDetailInitialInfoMedium: Boolean
}
type UpdateUserPreferencesPayload { preferences: UserPreferences! }

# Synchronized Community schema from memoria-api/schemas/graphql/community.graphql.
input RenameCommunityInput {
  communityId: ID!
  name: String!
}

type RenameCommunityPayload {
  community: Community!
}

extend type Query {
  myCommunities: [Community!]!
  community(communityId: ID!): Community
  communityUsage(communityId: ID!): CommunityUsage!
}

extend type Mutation {
  renameCommunity(input: RenameCommunityInput!): RenameCommunityPayload!
}

enum CommunityMemberRole {
  admin
  member
}

type CommunityMember {
  userId: ID!
  nickname: String!
  role: CommunityMemberRole!
  joinedAt: DateTime!
}

extend type Query {
  communityMembers(communityId: ID!): [CommunityMember!]!
}

input ChangeCommunityMemberRoleInput {
  communityId: ID!
  userId: ID!
  role: CommunityMemberRole!
}

type ChangeCommunityMemberRolePayload {
  success: Boolean!
}

extend type Mutation {
  changeCommunityMemberRole(input: ChangeCommunityMemberRoleInput!): ChangeCommunityMemberRolePayload!
}

input RemoveCommunityMemberInput {
  communityId: ID!
  userId: ID!
}

type CommunityMembershipMutationPayload {
  success: Boolean!
}

extend type Mutation {
  removeCommunityMember(input: RemoveCommunityMemberInput!): CommunityMembershipMutationPayload!
  leaveCommunity(communityId: ID!): CommunityMembershipMutationPayload!
}

# Read-only review for an irreversible Community deletion.
# The revision includes the exact Community-managed Media ID set and name.
type CommunityDeletionSnapshot {
  communityId: ID!
  name: String!
  managedMediaCount: Int!
  revision: String!
}

extend type Query {
  communityDeletionSnapshot(communityId: ID!): CommunityDeletionSnapshot!
}

# Accepts logical deletion; physical Media cleanup is handled asynchronously.
input AcceptCommunityDeletionInput {
  communityId: ID!
  revision: String!
}

type AcceptCommunityDeletionPayload {
  accepted: Boolean!
}

extend type Mutation {
  acceptCommunityDeletion(input: AcceptCommunityDeletionInput!): AcceptCommunityDeletionPayload!
}

# Group / Media schema snapshot synchronized from memoria-api executable SDL.
# Shared Media contract from memoria-design/content/system/api/graphql.mdx.
# Group.media is direct membership; Group.aggregateMedia includes descendants.
enum MediaType { IMAGE VIDEO }
enum MediaStatus { ACTIVE DELETING }
enum ProcessingStatus { PROCESSING READY FAILED }
enum BulkItemStatus { SUCCEEDED ALREADY_APPLIED FAILED }

type Media {
  id: ID!
  mediaType: MediaType!
  status: MediaStatus!
  originalFileName: String!
  fileSize: Int!
  mimeType: String!
  uploadedBy: MediaUploader
  uploadedAt: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
  image: Image
  processing: MediaProcessing
  groups(scope: ScopeInput!, first: Int, after: String, last: Int, before: String): MediaGroupConnection!
  tags(scope: ScopeInput!, first: Int, after: String, last: Int, before: String): MediaTagConnection!
}
type MediaUploader {
  userId: ID
  nickname: String
  deleted: Boolean!
}
# Variants can be empty while Processing is pending or has failed.
# Clients select a suitable width; array order is not a thumbnail priority.
# Variant URL is an authorized, browser-reachable URL, never a storage key.
type Image { width: Int! height: Int! variants: [ImageVariant!]! }
type ImageVariant {
  id: ID!
  format: String!
  width: Int!
  height: Int!
  sizeBytes: Int!
  url: String!
}
type MediaProcessing { status: ProcessingStatus! }
type MediaEdge { cursor: String! node: Media! }
type MediaConnection { edges: [MediaEdge!]! pageInfo: PageInfo! }
# Tag IDs are scoped to the requested ScopeInput. Empty means no filtering;
# invalid, duplicated, or cross-scope IDs are VALIDATION, not empty results.
# Multiple IDs combine with AND semantics.
input MediaFilterInput { tagIds: [ID!] }
extend type Query {
  media(id: ID!): Media
  mediaList(scope: ScopeInput!, filter: MediaFilterInput, first: Int, after: String, last: Int, before: String): MediaConnection!
}
type MediaTag { id: ID! name: String! }
type MediaTagEdge { cursor: String! node: MediaTag! }
type MediaTagConnection { edges: [MediaTagEdge!]! pageInfo: PageInfo! }
extend type Query {
  mediaTags(scope: ScopeInput!, search: String, first: Int, after: String, last: Int, before: String): MediaTagConnection!
}

# Source of Truth: memoria-design/content/system/api/graphql.mdx#group
type MediaGroup {
  id: ID!
  name: String!
  stateToken: String!
  createdAt: DateTime!
  parents(first: Int, after: String, last: Int, before: String): MediaGroupConnection!
  children(first: Int, after: String, last: Int, before: String): MediaGroupConnection!
  media(first: Int, after: String, last: Int, before: String): MediaConnection!
  aggregateMedia(first: Int, after: String, last: Int, before: String): MediaConnection!
}

type MediaGroupEdge {
  cursor: String!
  node: MediaGroup!
}

type MediaGroupConnection {
  edges: [MediaGroupEdge!]!
  pageInfo: PageInfo!
}

enum ScopeType {
  PERSONAL
  COMMUNITY
}

input ScopeInput {
  type: ScopeType!
  communityId: ID
}

enum MediaGroupRelationUnavailableReason {
  SELF
  ALREADY_RELATED
  OPPOSITE_RELATION
  CYCLE
  DEPTH_LIMIT
  PARENT_LIMIT
  CHILD_LIMIT
}

type MediaGroupRelationActionAvailability {
  canAdd: Boolean!
  unavailableReason: MediaGroupRelationUnavailableReason
}

type MediaGroupRelationCandidate {
  group: MediaGroup!
  isParent: Boolean!
  isChild: Boolean!
  addAsParent: MediaGroupRelationActionAvailability!
  addAsChild: MediaGroupRelationActionAvailability!
}

type MediaGroupRelationCandidateEdge {
  cursor: String!
  node: MediaGroupRelationCandidate!
}

type MediaGroupRelationCandidateConnection {
  edges: [MediaGroupRelationCandidateEdge!]!
  pageInfo: PageInfo!
}

enum MediaGroupSort {
  NAME_ASC
  CREATED_AT_DESC
}

extend type Query {
  mediaGroups(scope: ScopeInput!, search: String, sort: MediaGroupSort! = NAME_ASC, first: Int, after: String, last: Int, before: String): MediaGroupConnection!
  mediaGroup(id: ID!): MediaGroup
  mediaGroupRelationCandidates(groupId: ID!, search: String, first: Int, after: String, last: Int, before: String): MediaGroupRelationCandidateConnection!
}

input CreateMediaGroupInput {
  scope: ScopeInput!
  name: String!
  parentGroupIds: [ID!]!
  childGroupIds: [ID!]!
}

input DeleteMediaGroupInput {
  groupId: ID!
}

input MediaGroupRelationChangeInput {
  groupId: ID!
  direction: MediaGroupRelationDirection!
  action: MediaGroupRelationChangeAction!
}

enum MediaGroupRelationDirection {
  PARENT
  CHILD
}

enum MediaGroupRelationChangeAction {
  ADD
  REMOVE
}

enum MediaGroupRelationChangeStatus {
  SUCCEEDED
  ALREADY_APPLIED
  FAILED
}

type MediaGroupRelationChangeResult {
  groupId: ID!
  direction: MediaGroupRelationDirection!
  action: MediaGroupRelationChangeAction!
  status: MediaGroupRelationChangeStatus!
  errorCode: String
  unavailableReason: MediaGroupRelationUnavailableReason
}

input UpdateMediaGroupInput {
  groupId: ID!
  expectedStateToken: String!
  name: String!
  parentGroupIds: [ID!]!
  childGroupIds: [ID!]!
}

type UpdateMediaGroupPayload {
  group: MediaGroup!
}

input AddMediaToGroupsInput {
  groupIds: [ID!]!
  mediaIds: [ID!]!
}

input ChangeMediaGroupClassificationInput {
  groupId: ID!
  mediaIds: [ID!]!
}

type MediaGroupPayload {
  group: MediaGroup!
}

type DeleteMediaGroupPayload {
  groupId: ID!
}

type MediaGroupClassificationItemResult {
  mediaId: ID!
  status: BulkItemStatus!
  errorCode: String
}

type ChangeMediaGroupClassificationPayload {
  results: [MediaGroupClassificationItemResult!]!
}

extend type Mutation {
  createMediaGroup(input: CreateMediaGroupInput!): MediaGroupPayload!
  updateMediaGroup(input: UpdateMediaGroupInput!): UpdateMediaGroupPayload!
  deleteMediaGroup(input: DeleteMediaGroupInput!): DeleteMediaGroupPayload!
  addMediaToGroup(input: ChangeMediaGroupClassificationInput!): ChangeMediaGroupClassificationPayload!
  addMediaToGroups(input: AddMediaToGroupsInput!): ChangeMediaGroupClassificationPayload!
  removeMediaFromGroup(input: ChangeMediaGroupClassificationInput!): ChangeMediaGroupClassificationPayload!
}

# Usage契約: memoria-api/schemas/graphql/user.graphql・community.graphql
# Int64はGraphQLレスポンス上で10進数文字列として返される。
enum OriginalImageFormat { JPEG PNG WEBP HEIF }
type MediaFormatUsage { format: OriginalImageFormat! mediaCount: Int! usedBytes: Int64! }
type StorageUsage { usedBytes: Int64! effectiveLimitBytes: Int64! }
type UserUsage { mediaCount: Int! storage: StorageUsage! formatBreakdown: [MediaFormatUsage!]! }
type CommunityUsage { mediaCount: Int! storage: StorageUsage! formatBreakdown: [MediaFormatUsage!]! }

extend type Mutation { updateCommunitySettings(input: UpdateCommunitySettingsInput!): UpdateCommunitySettingsPayload! }
