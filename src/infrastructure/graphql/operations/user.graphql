query CurrentUser {
  me { id profile { nickname } preferences { personalAccentColor dateFormat fileSizeUnit mediaThumbnailSize mediaDetailNavigationWrap mediaDetailInitialInfoWide mediaDetailInitialInfoMedium } }
}

mutation RegisterMemoriaUser($input: RegisterUserInput!) {
  registerUser(input: $input) { user { id profile { nickname } } }
}

mutation UpdateMemoriaUserProfile($input: UpdateUserProfileInput!) {
  updateUserProfile(input: $input) {
    __typename
    ... on UpdateUserProfileSuccess { user { id profile { nickname } } }
    ... on InputValidationFailure { violations { scope code inputPaths { segments } } }
  }
}

mutation SaveUserPreferences($input: UpdateUserPreferencesInput!) {
  updateUserPreferences(input: $input) {
    __typename
    ... on InputValidationFailure { violations { scope code inputPaths { segments } } }
    ... on UpdateUserPreferencesSuccess {
      preferences {
      personalAccentColor
      dateFormat
      fileSizeUnit
      mediaThumbnailSize
      mediaDetailNavigationWrap
      mediaDetailInitialInfoWide
      mediaDetailInitialInfoMedium
      }
    }
  }
}

query PersonalUsage {
  me {
    id
    preferences { fileSizeUnit }
    usage {
      mediaCount
      storage { usedBytes effectiveLimitBytes }
      formatBreakdown { format mediaCount usedBytes }
    }
  }
}
