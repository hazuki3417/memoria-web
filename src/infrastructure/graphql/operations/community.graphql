query MyCommunities {
  myCommunities { id name createdAt updatedAt mySettings { accentColor } }
}

query CommunityDetails($communityId: ID!) {
  community(communityId: $communityId) { id name createdAt updatedAt }
}

query CommunityMembers($communityId: ID!) {
  communityMembers(communityId: $communityId) { userId nickname role joinedAt }
}

query CommunityDeletionSnapshot($communityId: ID!) {
  communityDeletionSnapshot(communityId: $communityId) { communityId name managedMediaCount revision }
}

mutation CreateCommunity($input: CreateCommunityInput!) {
  createCommunity(input: $input) { community { id name createdAt updatedAt } }
}

mutation RenameCommunity($input: RenameCommunityInput!) {
  renameCommunity(input: $input) { community { id name createdAt updatedAt } }
}

mutation ChangeCommunityMemberRole($input: ChangeCommunityMemberRoleInput!) {
  changeCommunityMemberRole(input: $input) { success }
}

mutation RemoveCommunityMember($input: RemoveCommunityMemberInput!) {
  removeCommunityMember(input: $input) { success }
}

mutation LeaveCommunity($communityId: ID!) {
  leaveCommunity(communityId: $communityId) { success }
}

mutation AcceptCommunityDeletion($input: AcceptCommunityDeletionInput!) {
  acceptCommunityDeletion(input: $input) { accepted }
}

query CommunityUsage($communityId: ID!) {
  communityUsage(communityId: $communityId) {
    mediaCount
    storage { usedBytes effectiveLimitBytes }
    formatBreakdown { format mediaCount usedBytes }
  }
}

query CommunityMySettings($communityId: ID!) {
  community(communityId: $communityId) {
    id
    mySettings { accentColor }
  }
}

mutation UpdateCommunitySettings($input: UpdateCommunitySettingsInput!) {
  updateCommunitySettings(input: $input) {
    settings { accentColor }
  }
}
