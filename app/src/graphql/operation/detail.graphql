query GetImages($input: ImageQueryInput) {
  images(input: $input) {
    edges {
      node {
        id
        info {
          file {
            name
            size
            date
          }
          size {
            width
            height
          }
          tags
        }
        src {
          thumbnail
          original
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
