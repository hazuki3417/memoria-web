enum Visibility {
  PUBLIC
  PRIVATE
}

input UploadImageInput {
  file: Upload!
  tags: [String!]!
  visibility: Visibility!
}

type UploadImagePayload {
  id: ID!
  url: String!
  tags: [String!]!
  visibility: Visibility!
}

extend type Mutation {
  uploadImage(input: UploadImageInput!): UploadImagePayload!
}
