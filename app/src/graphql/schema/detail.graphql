extend type Query {
  images(input: PaginationInput): ImageConnection!
}

# === data model ===

type Image {
  id: ID!
  info: ImageInfo!
  src: ImageSrc!
}

type ImageInfo {
  file: ImageFile!
  size: ImageSize!
  tags: [String!]!
}

type ImageFile {
  name: String!
  size: Int!
  date: String!
}

type ImageSize {
  width: Int!
  height: Int!
}

type ImageSrc {
  thumbnail: String!
  original: String!
}

# === relay model ===

type ImageEdge {
  node: Image!
  cursor: String!
}

type ImageConnection {
  edges: [ImageEdge!]!
  pageInfo: PageInfo!
}
