name: CI / Storybook Responsive

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/components/**'
      - 'src/features/**'
      - 'src/prototypes/**'
      - '.storybook/**'
      - 'tests/storybook-responsive/**'
      - 'playwright.storybook-responsive.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  responsive-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Chromiumをインストール
        run: npx playwright install --with-deps chromium
      - name: Storybook Responsive Preview
        run: npm run test:responsive
      - name: Upload responsive preview images for Visual Review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usage-responsive-previews-unapproved
          path: |
            tests/storybook-responsive/screenshots/
            tests/storybook-responsive/report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
