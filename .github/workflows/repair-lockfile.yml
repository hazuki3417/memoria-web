name: One-off lockfile repair
on:
  push:
    paths:
      - .github/workflows/repair-lockfile.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Regenerate and validate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-lockfile.yml
          git add package-lock.json
          git commit -m "fix: regenerate dependency lockfile for clean npm ci"
          git push
