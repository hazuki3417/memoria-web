name: quality

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Archive dependencies
        run: tar -cf /tmp/node_modules.tar node_modules

      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp/node_modules.tar
          retention-days: 1

  source:
    name: source
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BIOME_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      API_URI: http://localhost:8080/graphql
      APP_BASE_URL: http://localhost:3000
      AUTH0_DOMAIN: ci-example.auth0.com
      AUTH0_CLIENT_ID: ci-client-id
      AUTH0_CLIENT_SECRET: ci-placeholder-client-secret
      AUTH0_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Restore dependencies
        uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - name: Extract dependencies
        run: tar -xf /tmp/node_modules.tar
      - name: Generate GraphQL client
        run: npm run gen:graphql

      - name: Check source with Biome
        run: npm run check

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

  application-build:
    name: application-build
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BIOME_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      API_URI: http://localhost:8080/graphql
      APP_BASE_URL: http://localhost:3000
      AUTH0_DOMAIN: ci-example.auth0.com
      AUTH0_CLIENT_ID: ci-client-id
      AUTH0_CLIENT_SECRET: ci-placeholder-client-secret
      AUTH0_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Restore dependencies
        uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - name: Extract dependencies
        run: tar -xf /tmp/node_modules.tar
      - name: Generate GraphQL client
        run: npm run gen:graphql

      - name: Build Next.js application
        run: npm run build

      - name: Check client bundle for server secrets
        shell: bash
        run: |
          for secret_name in AUTH0_SECRET AUTH0_CLIENT_SECRET; do
            secret_value="${!secret_name}"
            if grep -R -l -F -- "$secret_value" .next/static; then
              echo "::error::$secret_name was found in the client bundle"
              exit 1
            fi
          done
  storybook:
    name: storybook
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BIOME_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      API_URI: http://localhost:8080/graphql
      APP_BASE_URL: http://localhost:3000
      AUTH0_DOMAIN: ci-example.auth0.com
      AUTH0_CLIENT_ID: ci-client-id
      AUTH0_CLIENT_SECRET: ci-placeholder-client-secret
      AUTH0_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Restore dependencies
        uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - name: Extract dependencies
        run: tar -xf /tmp/node_modules.tar
      - name: Generate GraphQL client
        run: npm run gen:graphql

      - name: Build Storybook
        run: npm run build:storybook

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Smoke test Storybook in browser
        run: npx playwright test --config=playwright.vrt.config.ts --grep 'Storybook smoke'

      - name: Upload Storybook smoke test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-smoke-report
          path: e2e/vrt/report
          if-no-files-found: ignore

