name: Web Quality Gate (minimal)

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run check:type

  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Vitest unit tests
        run: npm run test:unit

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH0_SECRET: '0123456789abcdef0123456789abcdef'
      AUTH0_BASE_URL: 'http://localhost:3000'
      APP_BASE_URL: 'http://localhost:3000'
      AUTH0_DOMAIN: 'example.auth0.com'
      AUTH0_CLIENT_ID: 'ci-placeholder'
      AUTH0_CLIENT_SECRET: 'ci-placeholder'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Next.js production build
        run: npm run build:next

  interaction-test:
    name: interaction-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Chromiumをインストール
        run: npx playwright install --with-deps chromium
      - name: Storybook Interaction Test
        run: npm run test:interaction
