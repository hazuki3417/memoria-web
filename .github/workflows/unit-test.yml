name: Unit Test

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/components/**'
      - 'src/features/**'
      - 'src/lib/**'
      - 'src/providers/**'
      - 'src/infrastructure/**'
      - '!src/**/*.stories.*'
      - 'package.json'
      - 'package-lock.json'
      - 'devbox.json'
      - 'devbox.lock'
      - 'scripts/**'
      - 'tsconfig.json'
      - 'next-env.d.ts'
      - 'biome.json'
      - 'vitest.config.ts'
      - 'vitest.shims.d.ts'
      - '.github/workflows/unit-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Vitest unit tests
        run: npm run test:unit
