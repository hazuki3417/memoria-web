name: Storybook Interaction

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/components/**'
      - 'src/features/**'
      - 'src/prototypes/**'
      - 'src/lib/**'
      - 'src/providers/**'
      - 'src/infrastructure/**'
      - 'src/app/globals.css'
      - 'src/app/layout.tsx'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interaction-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Restore installed dependencies
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies on cache miss
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Chromiumをインストール
        run: npx playwright install --with-deps chromium
      - name: Storybook Interaction Test
        run: npm run test:interaction
