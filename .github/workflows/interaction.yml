name: Storybook Interaction

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/components/**'
      - 'src/features/**'
      - 'src/prototypes/**'
      - 'src/lib/**'
      - 'src/providers/**'
      - 'src/infrastructure/**'
      - 'src/app/globals.css'
      - 'src/app/layout.tsx'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interaction-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Chromiumをインストール
        run: npx playwright install --with-deps chromium
      - name: Storybook Interaction Test
        run: npm run test:interaction
