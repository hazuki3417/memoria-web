name: TypeScript Check

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'devbox.json'
      - 'devbox.lock'
      - 'scripts/**'
      - 'tsconfig.json'
      - 'next-env.d.ts'
      - 'biome.json'
      - '.storybook/**'
      - 'codegen.ts'
      - 'vitest*.ts'
      - '.github/workflows/typecheck.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run check:type
