name: CI / Next.js Build

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'src/ui/**'
      - 'src/hooks/**'
      - 'src/features/**'
      - 'src/infrastructure/**'
      - 'src/lib/**'
      - 'src/providers/**'
      - 'src/proxy.ts'
      - '!src/**/*.stories.*'
      - 'package.json'
      - 'package-lock.json'
      - 'docker/runtime/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/build.yml'
      - '.dockerignore'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'scripts/link-dev-assets.mjs'
      - 'public/**'
      - 'storybook-assets/**'
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH0_SECRET: '0123456789abcdef0123456789abcdef'
      AUTH0_BASE_URL: 'http://localhost:3000'
      APP_BASE_URL: 'http://localhost:3000'
      AUTH0_DOMAIN: 'example.auth0.com'
      AUTH0_CLIENT_ID: 'ci-placeholder'
      AUTH0_CLIENT_SECRET: 'ci-placeholder'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Next.js production build
        run: npm run build:next
      - name: Validate local runtime Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
      - name: Build Development runtime image
        run: MEMORIA_WEB_IMAGE="memoria-web:${GITHUB_SHA}" docker compose --env-file .env.example -f docker-compose.yml build web
      - name: Verify Web runtime starts and responds
        run: MEMORIA_WEB_IMAGE="memoria-web:${GITHUB_SHA}" docker compose --env-file .env.example -f docker-compose.yml up -d --no-build --wait --wait-timeout 120 web
      - name: Collect runtime logs when failed
        if: failure()
        run: MEMORIA_WEB_IMAGE="memoria-web:${GITHUB_SHA}" docker compose --env-file .env.example -f docker-compose.yml logs --no-color web
      - name: Clean up runtime containers
        if: always()
        run: MEMORIA_WEB_IMAGE="memoria-web:${GITHUB_SHA}" docker compose --env-file .env.example -f docker-compose.yml down --remove-orphans

  publish-ghcr:
    name: GHCR / Web Image
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build reviewed runtime image for linux/amd64
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_OWNER,,}/memoria-web:${GITHUB_SHA}"
          docker build --platform linux/amd64 -f docker/runtime/Dockerfile --target runtime -t "$image" .
      - name: Login to GHCR with short-lived workflow token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish commit-specific private image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_OWNER,,}/memoria-web:${GITHUB_SHA}"
          docker push "$image" | tee "$RUNNER_TEMP/ghcr-push.log"
          digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\\1/p' "$RUNNER_TEMP/ghcr-push.log" | tail -n 1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "GHCR PushのManifest Digestを取得できません。" >&2
            exit 1
          fi
          printf 'Image: \`%s@%s\`\\n' "${image%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
