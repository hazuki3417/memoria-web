name: Next.js Build

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'src/features/**'
      - 'src/infrastructure/**'
      - 'src/lib/**'
      - 'src/providers/**'
      - 'src/proxy.ts'
      - '!src/**/*.stories.*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH0_SECRET: '0123456789abcdef0123456789abcdef'
      AUTH0_BASE_URL: 'http://localhost:3000'
      APP_BASE_URL: 'http://localhost:3000'
      AUTH0_DOMAIN: 'example.auth0.com'
      AUTH0_CLIENT_ID: 'ci-placeholder'
      AUTH0_CLIENT_SECRET: 'ci-placeholder'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Restore installed dependencies
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies on cache miss
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Next.js production build
        run: npm run build:next
